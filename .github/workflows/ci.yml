name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# These jobs only read the code. Narrowing the token means a malicious
# dependency pulled in by `npm ci` cannot push commits or edit the repo.
permissions:
  contents: read

# If someone pushes twice to the same PR, cancel the older run so we only pay
# for the checks on the newest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Every NEXT_PUBLIC_* value is already shipped to the browser, so these are
      # not sensitive, but they live in repo secrets so CI matches Vercel. The
      # fallbacks keep the build green for pull requests opened from forks, which
      # GitHub deliberately does not give secrets to.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY || 'placeholder' }}
          NEXT_PUBLIC_GOOGLE_CALENDAR_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CALENDAR_ID || 'placeholder' }}
          NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY || 'placeholder' }}
          NEXT_PUBLIC_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_FOLDER_ID || 'placeholder' }}
